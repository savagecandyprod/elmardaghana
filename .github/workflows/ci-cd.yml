name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - master
      # - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Deploy Backend Cloud Service
        working-directory: ./packages/backend
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "CONVEX_URL=${{ secrets.CONVEX_URL }}" >> .env
            echo "CONVEX_DEPLOY_KEY=${{ secrets.CONVEX_DEPLOY_KEY }}" >> .env
            pnpm dlx convex deploy
          fi

      - name: Build & Deploy App-Frontend to Cloudflare Workers
        working-directory: ./apps/app
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}" >> .env
            echo "NEXT_PUBLIC_CONVEX_SITE_URL=${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}" >> .env
            pnpm run deploy
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            pnpm run deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build & Deploy Web-Frontend to Cloudflare Workers
        working-directory: ./apps/web
        run: |
          if [ "${{ github.ref }}" == "refs/heads/master" ]; then
            echo "NEXT_PUBLIC_CONVEX_URL=${{ secrets.NEXT_PUBLIC_CONVEX_URL }}" >> .env
            echo "NEXT_PUBLIC_CONVEX_SITE_URL=${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}" >> .env
            pnpm run deploy
          elif [ "${{ github.ref }}" == "refs/heads/dev" ]; then
            pnpm run deploy
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
